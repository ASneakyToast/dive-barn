<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - Dive Barn 2025 | October 11, Mendocino County</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- CSS Layers - Single entry point for organized cascade -->
    <link rel="stylesheet" href="styles/layers.css">
</head>
<body>
    <!-- Skip link for accessibility -->
    <a href="#schedule" class="skip-link">Skip to main content</a>
    
    <!-- Theme Toggle -->
    <db-theme-toggle></db-theme-toggle>
    
    <!-- Navigation -->
    <dive-barn-nav></dive-barn-nav>

    <!-- Floating RSVP Button -->
    <db-floating-button 
        href="https://partiful.com/e/Ft3EJk5f8OUREaoQKtBo" 
        text="RSVP" 
        icon="→" 
        aria-label="RSVP for Dive Barn 2025" 
        target="_blank" 
        rel="noopener">
    </db-floating-button>

    <!-- Schedule Section -->
    <section id="schedule" class="section section--schedule">
        <db-heading 
            title="Festival Schedule" 
            subtitle="October 11, 2025 - A day of music, art, and connection under the Mendocino stars">
        </db-heading>
        </div>
        
        <!-- Single Day Schedule -->
        <div class="schedule__day schedule__day--active">
            <div class="schedule__timeline">
                
                <db-timeline-item time="Ongoing"  type="schedule" title="Selby's Cones - Interactive Experience" description="Human-sized animal cones available for interactive sculptural performance throughout the day." category="Interactive Art" category-variant="art"></db-timeline-item>
                
                <db-timeline-item time="12:00 PM"  type="schedule" highlight title="Festival Opens + Shuttle Departure" description="Festival gates open with welcome orientation. Shuttle service departs from San Francisco - contact divebarnranch@gmail.com for details." category="Community" category-variant="community"></db-timeline-item>
                
                <db-timeline-item time="1:00 PM"  type="schedule" title="Eric's Walking Tour" description="Guided walking tour of the ranch grounds, art installations, and historical sites with Eric Henderson." category="Tour" category-variant="special"></db-timeline-item>
                
                <db-timeline-item time="1:30 PM"  type="schedule" title="Apple Pressing Workshop" description="Hands-on apple pressing workshop using ranch-grown apples. Learn the art of fresh cider making." category="Workshop" category-variant="workshop"></db-timeline-item>
                
                <db-timeline-item time="2:00 PM"  type="schedule" title="Shuttle Bus Arrives" description="San Francisco shuttle service arrives at the ranch. Welcome to all our San Francisco friends!" category="Transportation" category-variant="transportation"></db-timeline-item>
                
                <db-timeline-item time="2:30 PM"  type="schedule" title="Manu - First Performance" description="First of three special performances by Manu throughout the day." category="Performance" category-variant="performance"></db-timeline-item>
                
                <db-timeline-item time="3:00 PM"  type="schedule" title="Mary's Walking Tour" description="Artist-led walking tour exploring art installations and the creative landscape with Mary Graham." category="Tour" category-variant="special"></db-timeline-item>
                
                <db-timeline-item time="4:00 PM"  type="schedule" title="Manu - Second Performance" description="Second performance as the afternoon energy builds toward evening." category="Performance" category-variant="performance"></db-timeline-item>
                
                <db-timeline-item time="5:00 PM"  type="schedule" title="Food & Bar Service Opens" description="Full food service and bar opens for evening festivities. Enjoy locally-sourced dishes and craft beverages." category="Food & Drink" category-variant="community"></db-timeline-item>
                
                <db-timeline-item time="5:30 PM"  type="schedule" title="Video Projections + Manu Final Performance + Merch Drop" description="Video projection setup begins, Manu's final performance, and special merchandise release. Energy building toward golden hour!" category="Multi-Event" category-variant="art"></db-timeline-item>
                
                <db-timeline-item time="6:00 PM"  type="schedule" title="Mary's Sunset Songwalk" description="Musical walking experience as golden hour begins. A magical songwalk through the ranch landscape." category="Special Event" category-variant="special"></db-timeline-item>
                
                <db-timeline-item time="6:40 PM"  type="schedule" title="Sunset" description="Golden hour reaches its peak - the perfect moment for reflection and connection with the natural beauty." category="Nature" category-variant="special"></db-timeline-item>
                
                <db-timeline-item time="7:00 PM"  type="schedule" title="Good Actor" description="Indie rock collective delivering powerful melodies and introspective lyrics under the evening stars." category="Music" category-variant="music"></db-timeline-item>
                
                <db-timeline-item time="8:30 PM"  type="schedule" title="Secret Band?" description="A surprise musical guest - part of the evening's mystery and excitement. Come with an open mind!" category="Mystery Music" category-variant="music"></db-timeline-item>
                
                <db-timeline-item time="7:45 PM"  type="schedule" title="Town Bully" description="High-energy rock band bringing driving rhythms and electrifying performances as the night reaches its peak energy." category="Music" category-variant="music"></db-timeline-item>
                
                <db-timeline-item time="9:15 PM"  type="schedule" title="Secret Band 2?" description="Another surprise musical act to keep the night full of unexpected discoveries and spontaneous energy." category="Mystery Music" category-variant="music"></db-timeline-item>
                
                <db-timeline-item time="10:00 PM"  type="schedule" title="Jungle DJ Set" description="Late-night jungle and electronic beats to close out the festival. Dance into the night in the transformed barn." category="Late Night" category-variant="music"></db-timeline-item>
                
            </div>
        </div>
    </section>


    <!-- Footer -->
    <dive-barn-footer></dive-barn-footer>

    <script src="components/theme-switcher/theme-switcher.js"></script>
    <script src="components/theme-switcher/theme-toggle-component.js"></script>
    <script src="components/nav/nav-component.js"></script>
    <script src="components/button/button-component.js"></script>
    <script src="components/heading/heading-component.js"></script>
    <script src="components/timeline-item/timeline-item-component.js"></script>
    <script src="components/floating-button/floating-button-component.js"></script>
    <script src="components/footer/footer-component.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
